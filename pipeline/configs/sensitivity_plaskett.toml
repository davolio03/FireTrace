# XP-02 sensitivity sweep of the XP-01 highlight (P1) for the Plaskett Fire case.
# Run from the repository root:
#   uv run python -m pipeline.sensitivity --config pipeline/configs/sensitivity_plaskett.toml
# Grid agreed with David on 2026-11-15 (decisions B, C). It describes sensitivity only; the
# XP-01 operating point (combined index, window 3, threshold 2.0) is never changed from it.
# Relative paths resolve against the current working directory.

threshold_min = 0.5
threshold_max = 5.0
threshold_step = 0.25
windows = [1, 3, 5]
min_region_px = 100      # the XP-01 1 ha region filter, applied to every point
connectivity = 8

change_dir = "data/interim/change"
sar_dir = "data/interim/sar"
perimeter_dir = "data/interim/perimeter"
output_dir = "data/interim/sensitivity"
