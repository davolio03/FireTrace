name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Sync Python environment (Python 3.11 + dev group)
        # Switch to `uv sync --locked` once uv.lock is committed.
        run: uv sync
      - name: Check team guidance, then run quality.json lint (ruff check) and tests (pytest)
        run: python3 scripts/check.py
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Validate existing contract fixtures
        run: uv run contracts/tools/validate.py
