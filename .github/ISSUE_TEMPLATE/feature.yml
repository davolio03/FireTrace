name: Feature
description: Discuss a bounded feature; approval and task state belong in Kanvas
labels: [enhancement]
body:
  - type: input
    id: kanvas
    attributes:
      label: Kanvas task reference
      description: Link an existing task if available; an issue is not task approval.
  - type: textarea
    id: objective
    attributes:
      label: User-facing goal and P0/P1 scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe observable behavior and realistic failure cases.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, contracts and affected owners
  - type: textarea
    id: demo
    attributes:
      label: Verification or demo evidence to collect
    validations:
      required: true
