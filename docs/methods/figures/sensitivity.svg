<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="t d">
<title id="t">XP-02 highlight sensitivity, Plaskett</title>
<desc id="d">IoU with the WFIGS perimeter and highlighted area outside it against the threshold, window 3, for the combined, HH-only and HV-only indices. Values are in docs/methods/sensitivity.md and sensitivity.csv.</desc>
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--combined:#2a78d6;--hh:#eb6834;--hv:#1baf7a;}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--grid:#3a3936;--combined:#3987e5;--hh:#d95926;--hv:#199e70;}}
text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:var(--ink2);font-size:12px}
.head{fill:var(--ink);font-size:16px;font-weight:600}.title{fill:var(--ink);font-size:13px;font-weight:600}
.label{fill:var(--ink);font-size:12px}.note{font-size:11px}
.grid{stroke:var(--grid);stroke-width:1}.rule{stroke:var(--ink2);stroke-width:1;stroke-dasharray:2 3}
.chance{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4}
.s-combined{fill:none;stroke:var(--combined);stroke-width:2;stroke-linejoin:round}.s-hh{fill:none;stroke:var(--hh);stroke-width:2;stroke-linejoin:round}.s-hv{fill:none;stroke:var(--hv);stroke-width:2;stroke-linejoin:round}
</style>
<rect width="720" height="640" fill="var(--surface)"/>
